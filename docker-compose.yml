version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: episodic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: episodic
      POSTGRES_PASSWORD: episodic_password
      POSTGRES_DB: episodic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episodic -d episodic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episodic_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://episodic:episodic_password@db:5432/episodic_db
      SECRET_KEY: change-this-in-production-to-a-strong-random-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:5500","http://127.0.0.1:5500"]'
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
