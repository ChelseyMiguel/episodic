app = "episodic"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"
  STORAGE_BACKEND = "local"
  UPLOAD_DIR = "/data/uploads"

[mounts]
  source = "episodic_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
