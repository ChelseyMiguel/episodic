<style>
  body { background-color: #fbf9f4; color: #1b1c19; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; }
  .bento-card { background: #ffffff; border: 1px solid #dac1ba; transition: transform 0.3s ease, border-color 0.3s ease; }
  .bento-card:hover { border-color: #944931; }
  .form-input { border-top: none; border-left: none; border-right: none; border-bottom: 1px solid #dac1ba; background: transparent; transition: border-color 0.3s ease; width: 100%; }
  .form-input:focus { outline: none; border-bottom: 1px solid #944931; box-shadow: none; }
  .error-banner { background: #ffdad6; border: 1px solid #ba1a1a; color: #93000a; border-radius: 0.5rem; padding: 0.75rem 1rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; }
  .tab-btn { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; padding: 0.75rem 1.5rem; border-bottom: 2px solid transparent; color: #54433e; transition: all 0.2s; cursor: pointer; background: none; border-top: none; border-left: none; border-right: none; }
  .tab-btn.active { color: #944931; border-bottom-color: #944931; }
  .tab-btn:not(.active):hover { color: #944931; }
  /* Dark mode */
  .dark body, .dark { background-color: #1c1a18; color: #e6e4df; }
  .dark header, .dark .bg-surface { background-color: #242220 !important; }
  .dark .bento-card { background-color: #242220; border-color: rgba(80,60,50,0.5); }
  .dark .border-outline-variant\/30 { border-color: rgba(80,60,50,0.5) !important; }
  .dark .text-on-surface { color: #e6e4df !important; }
  .dark .text-on-surface-variant { color: #b8a8a2 !important; }
  .dark .text-primary { color: #ffb59e !important; }
  .dark .bg-primary { background-color: #944931 !important; }
  .dark .text-on-primary { color: #fff !important; }
  .dark .form-input { border-bottom-color: rgba(80,60,50,0.6); color: #e6e4df; }
  .dark .form-input:focus { border-bottom-color: #ffb59e; }
  .dark .tab-btn { color: #b8a8a2; }
  .dark .tab-btn.active { color: #ffb59e; border-bottom-color: #ffb59e; }

<script>(function(){ if(localStorage.getItem('episodic_dark_mode')==='dark') document.documentElement.classList.add('dark'); })();</script>

<body class="font-body-md text-body-md">

<header class="bg-surface top-0 sticky z-50 border-b border-outline-variant/30">
  <div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto py-2 h-40">
    <div class="flex items-center gap-12">
      <a href="./index.html" class="hover:opacity-80 transition-opacity flex-shrink-0"><img src="./assets/LogoLight.png" alt="Episodic" class="h-36 w-auto" /></a>
      <nav class="hidden md:flex gap-8 items-center">
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./issues.html">Issues</a>
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./advocacy.html">Advocacy</a>
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./poetry.html">Poetry</a>
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./articles.html">Archive</a>
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./resources.html">Resources</a>
        <a class="text-on-surface-variant hover:text-primary hover:translate-y-[-1px] transition-all font-label-md text-label-md" href="./submit.html">Submit</a>
      </nav>
    </div>
    <div class="flex items-center gap-2">
      <button id="dark-mode-btn" title="Switch to dark mode" aria-label="Switch to dark mode"
        class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-container material-symbols-outlined">dark_mode</button>
      <a href="./index.html" class="bg-primary text-on-primary px-6 py-2 rounded-full font-label-md text-label-md hover:shadow-lg hover:brightness-110 active:scale-95 transition-all">Home</a>
    </div>
  </div>
</header>

<main class="pt-12 pb-24 px-margin-mobile md:px-margin-desktop flex items-start justify-center min-h-screen">
  <div class="w-full max-w-md">

    <!-- Logo / heading -->
    <div class="text-center mb-10">
      <a href="./index.html" class="hover:opacity-80 transition-opacity inline-block"><img src="./assets/LogoLight.png" alt="Episodic" class="h-32 w-auto object-contain mx-auto" /></a>
      <p class="font-body-md text-on-surface-variant mt-2">A space for your stories.</p>
    </div>

    <div class="bento-card rounded-xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b border-outline-variant/30">
        <button class="tab-btn active flex-1" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn flex-1" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Sign In panel -->
      <div id="panel-signin" class="p-8">
        <form id="signin-form" class="space-y-8" novalidate>
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-primary" for="signin-email">Email Address</label>
            <input id="signin-email" type="email" autocomplete="email" required placeholder="name@example.com" class="form-input py-2 text-body-md font-jakarta" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-primary" for="signin-password">Password</label>
            <input id="signin-password" type="password" autocomplete="current-password" required placeholder="Your password" class="form-input py-2 text-body-md font-jakarta" />
          </div>
          <div id="signin-error" class="hidden error-banner"></div>
          <button type="submit" id="signin-btn" class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
            Sign In
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </form>
        <p class="text-center font-body-md text-on-surface-variant mt-6 text-sm">
          Don't have an account?
          <button onclick="switchTab('signup')" class="text-primary hover:underline font-label-md bg-none border-none cursor-pointer">Create one</button>
        </p>
      </div>

      <!-- Sign Up panel -->
      <div id="panel-signup" class="p-8 hidden">
        <form id="signup-form" class="space-y-8" novalidate>
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-primary" for="signup-name">Display Name</label>
            <input id="signup-name" type="text" autocomplete="name" required placeholder="How you'd like to be known" class="form-input py-2 text-body-md font-jakarta" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-primary" for="signup-email">Email Address</label>
            <input id="signup-email" type="email" autocomplete="email" required placeholder="name@example.com" class="form-input py-2 text-body-md font-jakarta" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-md text-primary" for="signup-password">Password</label>
            <input id="signup-password" type="password" autocomplete="new-password" required placeholder="Choose a secure password" class="form-input py-2 text-body-md font-jakarta" />
          </div>
          <div id="signup-error" class="hidden error-banner"></div>
          <button type="submit" id="signup-btn" class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
            Create Account
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </form>
        <p class="text-center font-body-md text-on-surface-variant mt-6 text-sm">
          Already have an account?
          <button onclick="switchTab('signin')" class="text-primary hover:underline font-label-md bg-none border-none cursor-pointer">Sign in</button>
        </p>
      </div>
    </div>

  </div>
</main>

<footer class="w-full py-8 px-margin-mobile md:px-margin-desktop bg-surface-container-low border-t border-outline-variant/30">
  <div class="max-w-max-width-layout mx-auto text-center">
    <p class="font-body-md text-on-surface-variant text-sm">© 2026 Episodic Magazine. A Living Literary Magazine.</p>
  </div>
</footer>

<script type="module">
import api from './js/api.js';
import { isLoggedIn, setToken, setUser, updateNavForAuth } from './js/auth.js';

// Redirect if already logged in
if (isLoggedIn()) {
  window.location.href = './dashboard.html';
}

updateNavForAuth();

function switchTab(tab) {
  const signinTab = document.getElementById('tab-signin');
  const signupTab = document.getElementById('tab-signup');
  const signinPanel = document.getElementById('panel-signin');
  const signupPanel = document.getElementById('panel-signup');

  if (tab === 'signin') {
    signinTab.classList.add('active');
    signupTab.classList.remove('active');
    signinPanel.classList.remove('hidden');
    signupPanel.classList.add('hidden');
  } else {
    signupTab.classList.add('active');
    signinTab.classList.remove('active');
    signupPanel.classList.remove('hidden');
    signinPanel.classList.add('hidden');
  }
}

// Expose switchTab globally for onclick attributes
window.switchTab = switchTab;

// Check URL param for tab
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('tab') === 'signup') switchTab('signup');

function getReturnUrl() {
  const returnTo = urlParams.get('returnTo');
  return returnTo ? decodeURIComponent(returnTo) : './dashboard.html';
}

// Sign In
document.getElementById('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signin-error');
  const btn = document.getElementById('signin-btn');
  errEl.classList.add('hidden');

  const email = document.getElementById('signin-email').value.trim();
  const password = document.getElementById('signin-password').value;

  if (!email || !password) {
    errEl.textContent = 'Please enter your email and password.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const result = await api.auth.login(email, password);
    const token = result.access_token || result.token;
    const user = result.user || { email, display_name: result.display_name };
    setToken(token);
    setUser(user);
    window.location.href = getReturnUrl();
  } catch (err) {
    errEl.textContent = err.status === 401
      ? 'Incorrect email or password. Please try again.'
      : 'Sign in failed: ' + err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = 'Sign In <span class="material-symbols-outlined text-sm">arrow_forward</span>';
  }
});

// Sign Up
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signup-error');
  const btn = document.getElementById('signup-btn');
  errEl.classList.add('hidden');

  const displayName = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;

  if (!displayName || !email || !password) {
    errEl.textContent = 'Please fill in all fields.';
    errEl.classList.remove('hidden');
    return;
  }

  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';

  try {
    const result = await api.auth.signup(email, password, displayName);
    const token = result.access_token || result.token;
    const user = result.user || { email, display_name: displayName };
    setToken(token);
    setUser(user);
    window.location.href = './dashboard.html';
  } catch (err) {
    errEl.textContent = err.status === 409
      ? 'An account with this email already exists.'
      : 'Account creation failed: ' + err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = 'Create Account <span class="material-symbols-outlined text-sm">arrow_forward</span>';
  }
});

// Dark mode toggle
(function() {
  const btn = document.getElementById('dark-mode-btn');
  if (!btn) return;
  function syncBtn() {
    const isDark = document.documentElement.classList.contains('dark');
    btn.textContent = isDark ? 'light_mode' : 'dark_mode';
    btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', btn.title);
  }
  syncBtn();
  btn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('episodic_dark_mode', isDark ? 'dark' : 'light');
    syncBtn();
  });
})();
</script>
</body>
</html>
