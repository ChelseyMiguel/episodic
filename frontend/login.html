<script type="module">
import api from './js/api.js';
import { isLoggedIn, setToken, setUser, updateNavForAuth } from './js/auth.js';

// Redirect if already logged in
if (isLoggedIn()) {
  window.location.href = './dashboard.html';
}

updateNavForAuth();

function switchTab(tab) {
  const signinTab = document.getElementById('tab-signin');
  const signupTab = document.getElementById('tab-signup');
  const signinPanel = document.getElementById('panel-signin');
  const signupPanel = document.getElementById('panel-signup');

  if (tab === 'signin') {
    signinTab.classList.add('active');
    signupTab.classList.remove('active');
    signinPanel.classList.remove('hidden');
    signupPanel.classList.add('hidden');
  } else {
    signupTab.classList.add('active');
    signinTab.classList.remove('active');
    signupPanel.classList.remove('hidden');
    signinPanel.classList.add('hidden');
  }
}

// Expose switchTab globally for onclick attributes
window.switchTab = switchTab;

// Check URL param for tab
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('tab') === 'signup') switchTab('signup');

function getReturnUrl() {
  const returnTo = urlParams.get('returnTo');
  return returnTo ? decodeURIComponent(returnTo) : './dashboard.html';
}

// ── Show/hide password toggles ──────────────────────────────────────────────
function wireToggle(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if (!btn || !input) return;
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'visibility_off' : 'visibility';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
}
wireToggle('signin-password', 'signin-pw-toggle');
wireToggle('signup-password', 'signup-pw-toggle');
wireToggle('signup-confirm', 'signup-confirm-toggle');

// ── Password strength meter ──────────────────────────────────────────────────
const pwInput = document.getElementById('signup-password');
const pwLabel = document.getElementById('pw-strength-label');
const psBars = [document.getElementById('ps1'), document.getElementById('ps2'), document.getElementById('ps3'), document.getElementById('ps4')];
const strengthColors = ['bg-error', 'bg-error', 'bg-secondary', 'bg-primary'];
const strengthLabels = ['Too short', 'Weak', 'Fair', 'Strong'];

function calcStrength(pw) {
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
  return Math.min(score, 4);
}

pwInput.addEventListener('input', () => {
  const pw = pwInput.value;
  if (!pw) { pwLabel.classList.add('hidden'); psBars.forEach(b => b.className = 'h-1 flex-1 rounded-full bg-outline-variant transition-all'); return; }
  const s = calcStrength(pw);
  psBars.forEach((b, i) => {
    b.className = `h-1 flex-1 rounded-full transition-all ${i < s ? strengthColors[s - 1] : 'bg-outline-variant'}`;
  });
  pwLabel.textContent = strengthLabels[s - 1] || 'Too short';
  pwLabel.className = `text-xs transition-colors ${s <= 2 ? 'text-error' : s === 3 ? 'text-secondary' : 'text-primary'}`;
  pwLabel.classList.remove('hidden');
});

// ── Confirm password match check ────────────────────────────────────────────
const confirmInput = document.getElementById('signup-confirm');
const matchLabel = document.getElementById('pw-match-label');
confirmInput.addEventListener('input', () => {
  const match = confirmInput.value === pwInput.value;
  matchLabel.textContent = match ? '✓ Passwords match' : 'Passwords do not match';
  matchLabel.className = `text-xs ${match ? 'text-primary' : 'text-error'}`;
  matchLabel.classList.remove('hidden');
});

// ── Rate limiting (3 failed attempts → 30 s cooldown) ───────────────────────
const RATE_KEY = 'episodic_signin_attempts';
function getRateState() {
  try { return JSON.parse(localStorage.getItem(RATE_KEY)) || { count: 0, until: 0 }; } catch { return { count: 0, until: 0 }; }
}
function setRateState(s) { localStorage.setItem(RATE_KEY, JSON.stringify(s)); }
function isRateLimited() { const s = getRateState(); return s.count >= 3 && Date.now() < s.until; }
function rateCooldownSeconds() { return Math.ceil((getRateState().until - Date.now()) / 1000); }
function recordFailedAttempt() {
  const s = getRateState();
  s.count = (s.count || 0) + 1;
  if (s.count >= 3) s.until = Date.now() + 30000;
  setRateState(s);
}
function resetRateState() { localStorage.removeItem(RATE_KEY); }

// ── Sign In ──────────────────────────────────────────────────────────────────
document.getElementById('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signin-error');
  const btn = document.getElementById('signin-btn');
  errEl.classList.add('hidden');

  if (isRateLimited()) {
    errEl.textContent = `Too many failed attempts. Please wait ${rateCooldownSeconds()} seconds before trying again.`;
    errEl.classList.remove('hidden');
    return;
  }

  const email = document.getElementById('signin-email').value.trim();
  const password = document.getElementById('signin-password').value;

  // Basic email format check
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Please enter a valid email address.';
    errEl.classList.remove('hidden');
    return;
  }
  if (!password) {
    errEl.textContent = 'Please enter your password.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">progress_activity</span> Signing in…';

  try {
    const result = await api.auth.login(email, password);
    const token = result.access_token || result.token;
    const user = result.user || { email, display_name: result.display_name };
    setToken(token);
    setUser(user);
    resetRateState();
    window.location.href = getReturnUrl();
  } catch (err) {
    // Clear password on auth failure for security
    document.getElementById('signin-password').value = '';
    recordFailedAttempt();
    const state = getRateState();
    if (state.count >= 3) {
      errEl.textContent = `Too many failed attempts. Please wait 30 seconds before trying again.`;
    } else {
      errEl.textContent = err.status === 401
        ? `Incorrect email or password. ${3 - state.count} attempt${3 - state.count !== 1 ? 's' : ''} remaining.`
        : 'Sign in failed. Please check your connection and try again.';
    }
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = 'Sign In <span class="material-symbols-outlined text-sm">arrow_forward</span>';
  }
});

// ── Sign Up ──────────────────────────────────────────────────────────────────
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signup-error');
  const btn = document.getElementById('signup-btn');
  errEl.classList.add('hidden');

  const displayName = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;

  if (!displayName || !email || !password || !confirm) {
    errEl.textContent = 'Please fill in all fields.';
    errEl.classList.remove('hidden');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Please enter a valid email address.';
    errEl.classList.remove('hidden');
    return;
  }
  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.classList.remove('hidden');
    return;
  }
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match. Please re-enter.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined text-sm">progress_activity</span> Creating account…';

  try {
    const result = await api.auth.signup(email, password, displayName);
    const token = result.access_token || result.token;
    const user = result.user || { email, display_name: displayName };
    setToken(token);
    setUser(user);
    window.location.href = './dashboard.html';
  } catch (err) {
    errEl.textContent = err.status === 409
      ? 'An account with this email already exists. Try signing in instead.'
      : 'Account creation failed. Please check your connection and try again.';
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = 'Create Account <span class="material-symbols-outlined text-sm">arrow_forward</span>';
  }
});

// Dark mode toggle
(function() {
  const btn = document.getElementById('dark-mode-btn');
  if (!btn) return;
  function syncBtn() {
    const isDark = document.documentElement.classList.contains('dark');
    btn.textContent = isDark ? 'light_mode' : 'dark_mode';
    btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', btn.title);
  }
  syncBtn();
  btn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('episodic_dark_mode', isDark ? 'dark' : 'light');
    syncBtn();
  });
})();
</script>
<script>
(function() {
  var drawer = document.getElementById('mobile-nav-drawer');
  var overlay = document.getElementById('mobile-nav-overlay');
  var nav = document.getElementById('mobile-nav');
  function openNav() {
    nav.style.pointerEvents = 'auto';
    overlay.style.opacity = '1';
    drawer.style.transform = 'translateX(0)';
    document.body.style.overflow = 'hidden';
  }
  function closeNav() {
    nav.style.pointerEvents = 'none';
    overlay.style.opacity = '0';
    drawer.style.transform = 'translateX(100%)';
    document.body.style.overflow = '';
  }
  var hbtn = document.getElementById('hamburger-btn');
  var cbtn = document.getElementById('mobile-nav-close');
  if (hbtn) hbtn.addEventListener('click', openNav);
  if (cbtn) cbtn.addEventListener('click', closeNav);
  if (overlay) overlay.addEventListener('click', closeNav);
})();
</script>
</body>
</html>
